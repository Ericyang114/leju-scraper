<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>內容管理登入｜老楊房快說</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #C92D3F;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(0,0,0,.25);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
    }
    .logo { font-size: 2rem; text-align: center; margin-bottom: .25rem; }
    .title { font-size: 1.1rem; font-weight: 700; color: #C92D3F; text-align: center; margin-bottom: 1.75rem; }
    .form-control:focus { border-color: #C92D3F; box-shadow: 0 0 0 .2rem rgba(201,45,63,.2); }
    .btn-login {
      background: #C92D3F; border: none; color: #fff;
      width: 100%; padding: .6rem; border-radius: 8px;
      font-weight: 600; font-size: 1rem; margin-top: .5rem;
    }
    .btn-login:hover { background: #9d2232; color: #fff; }
    .back-link { text-align: center; margin-top: 1rem; font-size: .85rem; }
    .back-link a { color: #C92D3F; text-decoration: none; }
    .back-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">🔐</div>
    <div class="title">管理後台</div>

    {% if error %}
    <div class="alert alert-danger py-2 text-center" style="font-size:.875rem;">{{ error }}</div>
    {% endif %}

    <form method="post">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label fw-semibold" style="font-size:.875rem;">密碼</label>
        <input type="password" name="password" class="form-control" placeholder="請輸入管理密碼" autofocus>
      </div>
      <button type="submit" class="btn-login">登入</button>
    </form>

    <div class="back-link">
      <a href="/">← 返回公開頁面</a>
    </div>
  </div>
</body>
</html>
