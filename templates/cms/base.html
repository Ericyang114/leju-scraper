<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}內容管理{% endblock %}｜老楊房快說</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
</head>
<body class="cms-body">
  <div class="cms-bar">
    <a href="/admin">老楊房快說 · 內容管理</a>
    <div>
      <a href="/">看前台</a>
      · <a href="/dashboard">實價儀表板</a>
      · <a href="/admin/logout">登出</a>
    </div>
  </div>
  <nav class="cms-nav">
    <a href="/admin" {% if request.path == '/admin' %}aria-current="page"{% endif %}>總覽</a>
    <a href="/admin/profile" {% if request.path == '/admin/profile' %}aria-current="page"{% endif %}>個人資料</a>
    <a href="/admin/listings" {% if request.path.startswith('/admin/listings') %}aria-current="page"{% endif %}>物件</a>
    <a href="/admin/testimonials" {% if request.path.startswith('/admin/testimonials') %}aria-current="page"{% endif %}>見證</a>
    <a href="/admin/faqs" {% if request.path.startswith('/admin/faqs') %}aria-current="page"{% endif %}>FAQ</a>
    <a href="/admin/articles" {% if request.path.startswith('/admin/articles') %}aria-current="page"{% endif %}>文章</a>
    <a href="/admin/inquiries" {% if request.path.startswith('/admin/inquiries') %}aria-current="page"{% endif %}>諮詢名單</a>
  </nav>
  <main class="cms-main">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
      <p class="flash {{ cat }}">{{ msg }}</p>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
