{% extends "cms/base.html" %}
{% block title %}編輯見證{% endblock %}
{% block content %}
{% set v = item or {} %}
<h1>{% if v.id %}編輯見證{% else %}新增見證{% endif %}</h1>
<form class="stack-form card" method="post">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label>客戶稱呼<input name="client_label" required value="{{ v.client_label or '' }}"></label>
  <label>區域<input name="area" value="{{ v.area or '' }}"></label>
  <label>原文<textarea name="quote" required>{{ v.quote or '' }}</textarea></label>
  <label>排序<input name="sort_order" value="{{ v.sort_order if v.sort_order is not none else 0 }}"></label>
  <label class="check"><input type="checkbox" name="consent" {% if v.consent|string in ['1','on','true'] %}checked{% endif %}> 已取得本人同意可以公開這段文字</label>
  <label class="check"><input type="checkbox" name="published" {% if v.published|string in ['1','on','true'] %}checked{% endif %}> 上架</label>
  <label class="check"><input type="checkbox" name="is_demo" {% if v.is_demo|string in ['1','on','true'] %}checked{% endif %}> 示範資料（不能上架）</label>
  <button class="site-btn site-btn-red" type="submit">儲存</button>
</form>
{% if v.id %}
<form method="post" action="/admin/testimonials/{{ v.id }}/delete" onsubmit="return confirm('刪除這則見證？');">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <button class="site-btn site-btn-ghost" type="submit">刪除</button>
</form>
{% endif %}
{% endblock %}
