{% extends "cms/base.html" %}
{% block title %}編輯文章{% endblock %}
{% block content %}
{% set v = item or {} %}
<h1>{% if v.id %}編輯文章{% else %}新增文章{% endif %}</h1>
<form class="stack-form card" method="post">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label>標題<input name="title" required value="{{ v.title or '' }}"></label>
  <label>網址代碼（英數與減號，留白會自動產生）<input name="slug" value="{{ v.slug or '' }}"></label>
  <label>分類<input name="category" value="{{ v.category or '' }}"></label>
  <label>摘要<textarea name="summary">{{ v.summary or '' }}</textarea></label>
  <label>內文（空一行分段，網址會變成連結）<textarea name="body" required style="min-height:220px;">{{ v.body or '' }}</textarea></label>
  <label class="check"><input type="checkbox" name="published" {% if v.published|string in ['1','on','true'] %}checked{% endif %}> 上架</label>
  <label class="check"><input type="checkbox" name="is_demo" {% if v.is_demo|string in ['1','on','true'] %}checked{% endif %}> 示範草稿（不能上架）</label>
  <button class="site-btn site-btn-red" type="submit">儲存</button>
</form>
{% if v.id %}
<p><a href="/articles/{{ v.slug }}">預覽</a></p>
<form method="post" action="/admin/articles/{{ v.id }}/delete" onsubmit="return confirm('刪除這篇文章？');">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <button class="site-btn site-btn-ghost" type="submit">刪除</button>
</form>
{% endif %}
{% endblock %}
